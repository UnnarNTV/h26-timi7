<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Æfing 3</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Javascript 101</h1>

    <div class="card">
      <h2>Stimplaðu inn nafnið þitt:</h2>
      <input id="nameInput" type="text" placeholder="Nafnið þitt hér..." />
      <button onclick="sayHello()">Birta halló + nafn!</button>
      <div class="output" id="nameOutput">Niðurstaða birtist hér...</div>
    </div>

    <div class="card">
      <h2>Stimplaðu inn aldurinn þinn:</h2>
      <input id="ageInput" type="number" placeholder="Aldurinn þinn hér..." />
      <button onclick="checkAge()">Birta hvort fullorðinn eða barn</button>
      <div class="output" id="ageOutput">Niðurstaða birtist hér...</div>
    </div>

    <div class="card">
      <h2>Reiknivél</h2>
      <input id="num1" type="number" placeholder="Tala 1..." />
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <!-- ÆFING 3.1: Bættu * og / við hér -->
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input id="num2" type="number" placeholder="Tala 2..." />
      <button onclick="calculate()">Reikna</button>
      <div class="output" id="calcOutput">Niðurstaða birtist hér...</div>
    </div>

    <!-- ÆFING 3.2: Nýtt kort með takka sem birtir hrós -->
    <div class="card">
      <h2>Þarftu hrós?</h2>
      <button oclick="compliment()">Hrós</button>
      <div class="output" id="complimentOutput">Niðurstaða birtist hér</div>
    </div>
    <!-- ÆFING 3.3: Nýtt kort með input fyrir stig, takka og output -->
    <div class="card">
      <input
        id="scoreInput"
        type="number"
        min="0"
        max="100"
        placeholder="Sláðu inn stig 0 til 100"
      />
      <button onclick="showGrade()">Sýna einkunn</button>
      <div class="output" id="gradeOutput">Niðurstaða birtist hér</div>
    </div>
  </body>
</html>
